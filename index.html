            },
            {
              "@type": "Question",
              "name": "How do I list my business on BanglaHQ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sign up for a free account, click 'Add Your Business', and complete your profile with category, location, and contact details. Verification is free and takes 1–2 business days."
              }
            },

              "@type": "Question",
              "name": "Is BanglaHQ free to use?",

            }
          ]
        }
